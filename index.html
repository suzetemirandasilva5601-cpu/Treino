<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Treino Tryhard · PPL rotativo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%8B%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#20242d;--line:#2b303b;--txt:#e8eaed;--mut:#9aa0a6;--acc:#ff5a36;--ok:#2ecc71;--warn:#f1c40f;--blue:#4aa3ff;--purple:#b07cff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 14px calc(10px);padding-top:max(10px,env(safe-area-inset-top))}
header h1{font-size:17px;margin:0}
header small{color:var(--mut)}
main{padding:12px 12px 140px;max-width:760px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:#12151b;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 2px 8px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:19px}
nav button.on{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.sm{padding:6px 9px;font-size:12.5px}
.btn.ghost{background:none}
.mut{color:var(--mut)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--card2);border:1px solid var(--line)}
.tN{color:var(--txt)}.tC{color:var(--blue);border-color:#2b4a6b}.tB{color:var(--warn);border-color:#5d5220}.tK{color:var(--purple);border-color:#4a3870}.tRP{color:#ff8fab;border-color:#6b2b3d}.tW{color:var(--mut)}
h2{font-size:18px;margin:4px 0 10px}
h3{font-size:16px;margin:0}
.ex-head{display:flex;gap:10px}
.thumb{width:96px;height:96px;flex:none;border-radius:10px;overflow:hidden;background:#fff;position:relative;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;transition:opacity .25s}
.thumb img.b{animation:flip 2s infinite steps(1)}
@keyframes flip{0%{opacity:0}50%{opacity:1}}
table.sets{width:100%;border-collapse:collapse;margin-top:10px}
table.sets th{font-size:11px;color:var(--mut);font-weight:600;text-align:center;padding:3px}
table.sets td{padding:3px;text-align:center}
table.sets input{width:100%;min-width:0;background:#0f1115;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 4px;text-align:center;font-size:16px}
table.sets input::placeholder{color:#5f6670}
tr.done td{opacity:.55}
tr.done td:last-child{opacity:1}
.chk{width:38px;height:36px;border-radius:9px;border:1px solid var(--line);background:#0f1115;color:var(--mut);font-size:17px}
.chk.on{background:var(--ok);border-color:var(--ok);color:#06240f}
.sugg{font-size:12.5px;margin-top:8px;padding:7px 9px;border-radius:9px;background:#13202c;border:1px solid #23394d;color:#bcdcff}
.note{font-size:12.5px;color:var(--mut);margin-top:6px}
.warn{font-size:12px;color:var(--warn)}
.timer{position:fixed;left:10px;right:10px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:7;background:#1e2a1f;border:1px solid #2f5b37;border-radius:14px;padding:10px 12px;display:none;align-items:center;gap:10px;max-width:740px;margin:0 auto}
.timer.show{display:flex}
.timer b{font-size:24px;font-variant-numeric:tabular-nums}
.timer.over{background:#3a1d17;border-color:#7a3426}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--card2);border-radius:10px;padding:9px}
.stat b{display:block;font-size:19px}
.stat small{color:var(--mut);font-size:11.5px}
label.f{display:block;font-size:12px;color:var(--mut);margin:6px 0 3px}
input.f,select.f,textarea.f{width:100%;background:#0f1115;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px;font-size:15px}
.rot{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.rot span{padding:5px 8px;border-radius:8px;background:var(--card2);font-size:12px;border:1px solid var(--line)}
.rot span.cur{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.rot span.rest{color:var(--mut)}
.bar{height:8px;border-radius:5px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.list-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border:0}
svg text{fill:var(--mut);font-size:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:20;display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.modal .box{background:var(--card);border-radius:14px;padding:12px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.modal .imgs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.modal .imgs img{width:100%;border-radius:8px;background:#fff}
details summary{cursor:pointer;font-weight:600}
.guide p,.guide li{color:#cfd3d8}
.guide h3{margin-top:14px}
.pill{font-size:11px;color:var(--mut)}
.media{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;border-radius:12px;overflow:hidden;cursor:pointer;background:#000;margin:-2px 0 10px}
.media img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.media .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.media .play span{background:rgba(255,0,0,.92);color:#fff;border-radius:14px;padding:10px 18px;font-size:15px;font-weight:700;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.media .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:11.5px;color:#ddd;background:linear-gradient(transparent,rgba(0,0,0,.85));pointer-events:none}
.media .num{position:absolute;top:6px;font-size:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:1px 5px}
.how{margin-top:8px;background:var(--card2);border-radius:10px;padding:8px 10px}
.how summary{font-size:14px;color:#ffd2c6}
.how h4{margin:10px 0 3px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.how ol,.how ul{margin:0;padding-left:20px}
.how li{margin:3px 0;font-size:13.5px}
.how .bad li::marker{content:"✗  ";color:#ff6b6b}
.sinta{display:inline-block;margin-top:6px;font-size:12.5px;background:#2a1a14;border:1px solid #5a3022;color:#ffb39e;border-radius:8px;padding:3px 8px}
.vframe{position:relative;width:100%;max-width:340px;margin:0 auto;aspect-ratio:9/16;background:#000;border-radius:12px;overflow:hidden}
.vframe.wide{max-width:none;aspect-ratio:16/9}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vframe .off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#ccc;padding:20px;font-size:14px}
.vsrc{font-size:12px;color:var(--mut);text-align:center;margin:6px 0}
.tabs2{display:flex;gap:6px;margin:8px 0}
.tabs2 button{flex:1}
.tabs2 button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tag[data-act]{cursor:pointer}
.exhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.exnum{flex:none;width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.exname{font-size:19px;line-height:1.2;margin:0 0 4px}
.mchip{display:inline-block;font-size:12.5px;background:#2a1a14;border:1px solid #5a3022;color:#ffb39e;border-radius:8px;padding:2px 8px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 8px}
.mbox{position:relative;margin:0;border-radius:12px;overflow:hidden;cursor:pointer;aspect-ratio:9/14;background:#000}
.mbox.gif{background:#fff}
.mbox img{width:100%;height:100%;object-fit:cover;display:block}
.mbox.yt img{transform:scale(1.35)}
.mbox.gif img{object-fit:contain}
.mbox figcaption{position:absolute;left:0;right:0;bottom:0;padding:6px 8px;font-size:12px;font-weight:600;color:#fff;background:rgba(0,0,0,.72);line-height:1.25}
.mbox.gif figcaption{background:rgba(15,17,21,.85)}
.mbox figcaption small{font-weight:400;color:#ccc}
.mbox .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.mbox .play span{width:58px;height:58px;border-radius:50%;background:rgba(255,0,0,.92);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.mbox.playing{cursor:default}
.mbox.playing iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mbox .ytopen{position:absolute;right:6px;top:6px;font-size:11px;background:rgba(0,0,0,.7);color:#fff;padding:2px 6px;border-radius:6px;text-decoration:none;z-index:2}
.mgrid .vframe{max-width:none;aspect-ratio:9/14}
.thumb{background:#fff}
.thlbl{position:absolute;left:0;right:0;bottom:0;z-index:1;background:rgba(255,90,54,.92);color:#fff;font-size:10.5px;text-align:center;font-weight:700}
</style>
</head>
<body>
<header>
  <div class="row"><div class="sp"><h1>🏋️ Meu Treino</h1><small id="hdrSub"></small></div>
  <span id="netBadge" class="tag"></span></div>
</header>
<main id="app"></main>
<div class="timer" id="timer"><div class="sp"><small id="tLabel" class="mut">Descanso</small><br><b id="tVal">0:00</b></div>
  <button class="btn sm" data-tadd="-15">−15s</button><button class="btn sm" data-tadd="15">+15s</button><button class="btn sm" id="tStop">✕</button></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<nav id="nav">
  <button data-tab="hoje"><span>📅</span>Hoje</button>
  <button data-tab="treinos"><span>📋</span>Treinos</button>
  <button data-tab="progresso"><span>📈</span>Progresso</button>
  <button data-tab="historico"><span>🗂️</span>Histórico</button>
  <button data-tab="guia"><span>📖</span>Guia</button>
</nav>
<script>
// Programa baseado no vídeo "SE EU FOSSE TRYHARD NOS GANHOS É ASSIM QUE SERIA O MEU TREINO" (Samuel Meller)
// https://www.youtube.com/watch?v=DEUkEk5YLI0
// Tipos de série: N = normal (5–9 reps, perto da falha) | C = cluster 3×3 | B = backoff | K = Kelso shrug | RP = rest-pause
// "inferido": o item não foi falado com clareza no vídeo (aparece só na tela), então foi deduzido do contexto.
const VIDEO_ID = "DEUkEk5YLI0";
const PROGRAM_TRYHARD = [
  { id: "push1", name: "Push 1", short: "P1", focus: "Peito, ombros e tríceps", ex: [
    { id: "supino_reto_maq", name: "Supino reto na máquina", muscle: "Peito", img: "Machine_Bench_Press", yt: "supino reto máquina execução", t: 341, comp: true, warm: true,
      sets: ["N","N","C"], note: "2 séries de 5–9 e, na 3ª, cluster de 3 blocos × 3 reps com carga de ~4–5RM." },
    { id: "cross_polia_baixa", name: "Crossover na polia baixa", muscle: "Peito (clavicular)", img: "Low_Cable_Crossover", yt: "crossover polia baixa peitoral superior", t: 369,
      sets: ["N","N","N"], note: "3 séries retas. Sem backoff por logística (trocar peso na polia)." },
    { id: "pullover_halter", name: "Pullover com halter", muscle: "Peito / dorsal", img: "Bent-Arm_Dumbbell_Pullover", yt: "pullover com halter execução correta", t: 457,
      sets: ["N","N"], note: "Só 2 séries porque o setup é chato. Primeiro lugar para adicionar uma 3ª série no futuro." },
    { id: "desenv_articulado", name: "Desenvolvimento articulado (máquina)", muscle: "Deltoide anterior", img: "Leverage_Shoulder_Press", yt: "desenvolvimento máquina articulada ombro", t: 383, comp: true, warm: true,
      sets: ["N","N","C"], note: "2×5–9 + cluster 3×3. Tire um pouco de carga no cluster: a máquina é chata de tirar da inércia." },
    { id: "elev_lat_maq", name: "Elevação lateral na máquina", muscle: "Deltoide lateral", img: "Side_Lateral_Raise", yt: "elevação lateral máquina execução", t: 485,
      sets: ["N","N","B"], note: "2×5–9 + backoff." },
    { id: "triceps_frances", name: "Tríceps francês", muscle: "Tríceps", img: "Standing_Dumbbell_Triceps_Extension", yt: "tríceps francês halter execução", t: 492,
      sets: ["N","N"], note: "Só 2 séries: o tríceps já trabalhou muito nos presses." }
  ]},
  { id: "pull1", name: "Pull 1", short: "PL1", focus: "Costas e bíceps", ex: [
    { id: "puxada_frente", name: "Puxada frente (com strap)", muscle: "Dorsal", img: "Wide-Grip_Lat_Pulldown", yt: "puxada frente pulley execução", t: 531, comp: true, warm: true, inferred: true,
      sets: ["N","N","N"], note: "3 séries retas com strap. O nome aparece só na tela; no Pull 2 ele diz 'já fiz puxada lá' (20:26)." },
    { id: "remada_tbar", name: "Remada cavalinho (T-bar)", muscle: "Upper back", img: "T-Bar_Row_with_Handle", yt: "remada cavalinho t-bar execução", t: 556, comp: true,
      sets: ["N","N","N"], note: "3 séries retas. Daria para fazer cluster, mas o strap atrapalha." },
    { id: "remada_baixa_tri", name: "Remada baixa no triângulo", muscle: "Upper back / dorsal", img: "Seated_Cable_Rows", yt: "remada baixa triângulo execução", t: 584, comp: true,
      sets: ["N","N","C","K"], note: "2×5–9 + cluster 3×3 + Kelso shrug: descanse 20–25 s e faça só retrações escapulares até não sair mais." },
    { id: "pulldown_polia", name: "Pulldown na polia (braço estendido)", muscle: "Dorsal", img: "Straight-Arm_Pulldown", yt: "pulldown braço estendido polia", t: 661,
      sets: ["N","N","B"], note: "2×5–9 + backoff." },
    { id: "rosca_scott", name: "Rosca Scott (máquina)", muscle: "Bíceps", img: "Machine_Preacher_Curls", yt: "rosca scott máquina execução", t: 691,
      sets: ["N","N","C"], note: "Bilateral. Cluster só se a máquina for boa; com perfil de resistência ruim, troque o cluster por uma 3ª série normal." },
    { id: "rosca_martelo", name: "Rosca martelo", muscle: "Braquial / braquiorradial", img: "Hammer_Curls", yt: "rosca martelo execução", t: 708,
      sets: ["N","N"], note: "2 séries retas." }
  ]},
  { id: "legs1", name: "Legs 1", short: "L1", focus: "Quadríceps, posterior, adutores, glúteo, panturrilha", ex: [
    { id: "cadeira_flexora", name: "Cadeira flexora", muscle: "Posterior de coxa", img: "Seated_Leg_Curl", yt: "cadeira flexora execução", t: 758, warm: true, inferred: true,
      sets: ["N","N","N","B"], note: "Nome mostrado só na tela; o volume de posterior fica nesta sessão (14:41). 3×5–9 + backoff no lugar de uma 4ª série reta." },
    { id: "hack", name: "Agachamento no hack", muscle: "Quadríceps", img: "Hack_Squat", yt: "agachamento hack machine execução", t: 792, comp: true, warm: true,
      sets: ["N","N","C"], note: "2 normais + cluster 3×3." },
    { id: "adutora", name: "Cadeira adutora", muscle: "Adutores", img: "Thigh_Adductor", yt: "cadeira adutora execução", t: 826,
      sets: ["N","N","N"], note: "Séries normais. Evite técnicas avançadas: o adutor sofre muito dano muscular." },
    { id: "extensora1", name: "Cadeira extensora", muscle: "Quadríceps", img: "Leg_Extensions", yt: "cadeira extensora execução", t: 845,
      sets: ["N","N","N"], note: "Séries retas. Não faça logo depois do hack. O nº de séries não foi falado (inferido: 3)." },
    { id: "elev_pelvica", name: "Elevação pélvica", muscle: "Glúteo máximo", img: "Barbell_Hip_Thrust", yt: "elevação pélvica hip thrust execução", t: 888, comp: true,
      sets: ["N","N","C"], note: "2 normais + cluster. Use banco/máquina onde dê para apoiar a barra entre os blocos." },
    { id: "panturrilha_maq", name: "Panturrilha na máquina", muscle: "Panturrilha", img: "Calf_Press", yt: "panturrilha máquina execução", t: 932,
      sets: ["N","N"], note: "2×5–9 normais." }
  ]},
  { id: "push2", name: "Push 2", short: "P2", focus: "Peito, ombros e tríceps", ex: [
    { id: "supino_incl_maq", name: "Supino inclinado na máquina", muscle: "Peito (clavicular)", img: "Leverage_Incline_Chest_Press", yt: "supino inclinado máquina execução", t: 961, comp: true, warm: true,
      sets: ["N","N","N"], note: "3 séries normais. Na máquina porque já é a 2ª sessão de push." },
    { id: "paralelas", name: "Paralelas (mergulho)", muscle: "Peito (abdominal/inferior)", img: "Dips_-_Chest_Version", yt: "paralelas mergulho para peito execução", t: 995, comp: true,
      sets: ["N","N","N"], note: "3×5–9. Se passar de 9 reps, adicione carga com cinto." },
    { id: "voador", name: "Voador (peck deck)", muscle: "Peito (esternocostal)", img: "Butterfly", yt: "voador peck deck execução", t: 1006,
      sets: ["N","N","B"], note: "2×5–9 + backoff. Fica no fim dos exercícios de peito." },
    { id: "elev_frontal_polia", name: "Elevação frontal na polia", muscle: "Deltoide anterior", img: "Front_Cable_Raise", yt: "elevação frontal polia execução", t: 1041,
      sets: ["N","N","B"], note: "2×5–9 + backoff." },
    { id: "elev_lat_halter", name: "Elevação lateral com halteres", muscle: "Deltoide lateral", img: "Side_Lateral_Raise", yt: "elevação lateral halteres execução", t: 1070,
      sets: ["N","N","N"], note: "3 séries retas (com halteres para variar da máquina do Push 1)." },
    { id: "triceps_costas_polia", name: "Tríceps de costas para a polia", muscle: "Tríceps (cabeça longa)", img: "Cable_Rope_Overhead_Triceps_Extension", yt: "tríceps francês na polia de costas", t: 1133,
      sets: ["N","N","C"], note: "2×5–9 + cluster no final." }
  ]},
  { id: "pull2", name: "Pull 2", short: "PL2", focus: "Costas e bíceps", ex: [
    { id: "remada_articulada", name: "Remada articulada (máquina)", muscle: "Upper back", img: "Leverage_Iso_Row", yt: "remada articulada máquina execução", t: 1226, comp: true, warm: true,
      sets: ["N","N","K"], note: "2–3 séries + Kelso shrug na própria máquina: após a última série, espere alguns segundos e faça só retrações." },
    { id: "remada_unilat_neutra", name: "Remada baixa unilateral (pegada neutra)", muscle: "Dorsal", img: "Seated_One-arm_Cable_Pulley_Rows", yt: "remada baixa unilateral polia execução", t: 1345,
      sets: ["N","N"], note: "2×5–9 por lado." },
    { id: "barra_fixa", name: "Barra fixa", muscle: "Dorsal", img: "Pullups", yt: "barra fixa pronada execução", t: 1353, comp: true, inferred: true,
      sets: ["N","N","RP"], note: "Último exercício de costas, então dá para ir até o fim com rest-pause (interpretação da fala em 22:47). Use carga extra se passar de 9 reps." },
    { id: "rosca_bayesiana", name: "Rosca bayesiana (polia)", muscle: "Bíceps", img: "Standing_One-Arm_Cable_Curl", yt: "rosca bayesiana polia execução", t: 1381,
      sets: ["N","N"], note: "2 séries retas, sem técnica." },
    { id: "rosca_inversa", name: "Rosca inversa", muscle: "Braquiorradial", img: "Reverse_Barbell_Curl", yt: "rosca inversa barra execução", t: 1398,
      sets: ["N","N"], note: "2×5–9." }
  ]},
  { id: "legs2", name: "Legs 2", short: "L2", focus: "Posterior, quadríceps, glúteo médio", ex: [
    { id: "stiff", name: "Stiff com barra", muscle: "Posterior / glúteo", img: "Stiff-Legged_Barbell_Deadlift", yt: "stiff com barra execução", t: 1445, comp: true, warm: true,

</script>
<script>
"use strict";
// ---------- Constantes ----------
const TYPE = {
  W:{lbl:"Prep",full:"Série preparatória",reps:"8 / 4",rest:60},
  N:{lbl:"Normal",full:"Série de trabalho",reps:"5–9",rest:null},
  C:{lbl:"Cluster",full:"Cluster 3×3 (15–20 s entre blocos)",reps:"3+3+3",rest:null},
  B:{lbl:"Backoff",full:"Backoff (−25% da carga, ~30 s após a última série, até a falha)",reps:"falha",rest:null},
  K:{lbl:"Kelso",full:"Kelso shrug (20–25 s após a última série, só retração escapular)",reps:"falha",rest:null},
  RP:{lbl:"Rest-pause",full:"Rest-pause (falha → 15 s → falha → 15 s → falha)",reps:"falha+",rest:null}
};
const ALLSESS = Object.values(PROGRAMS).flatMap(p=>p.sessions);
const SESS = Object.fromEntries(ALLSESS.map(s=>[s.id,s]));
const EXBYID = {}; ALLSESS.forEach(s=>s.ex.forEach(e=>{ if(!EXBYID[e.id]) EXBYID[e.id]={...e,sessions:[]}; EXBYID[e.id].sessions.push(s.id); }));
const LSKEY = "treinoTryhard_v1";

// ---------- Estado ----------
const defaultState = () => ({ logs:[], rots:{}, draft:null,
  settings:{ program:"tryhard", phase:"full", restComp:180, restIso:120, stepUpper:1, stepLower:2.5, showWarm:true, sound:true }, body:[] });
let S;
try { S = Object.assign(defaultState(), JSON.parse(localStorage.getItem(LSKEY)||"{}")); S.settings = Object.assign(defaultState().settings, S.settings||{}); }
catch(e){ S = defaultState(); }
if (!PROGRAMS[S.settings.program]) S.settings.program = "tryhard";
S.rots = S.rots || {};
if (S.rot && !S.rots.tryhard && ROT_OK("tryhard", S.rot)) S.rots.tryhard = S.rot;
function ROT_OK(pid, r){ return r && PROGRAMS[pid].rotations[r.mode]; }
let PROGRAM, ROTATIONS;
function loadProgram(){
  const pid = S.settings.program, p = PROGRAMS[pid];
  PROGRAM = p.sessions; ROTATIONS = p.rotations;
  if (!ROT_OK(pid, S.rots[pid])) S.rots[pid] = {mode:Object.keys(ROTATIONS)[0], idx:0};
  S.rot = S.rots[pid];
}
loadProgram();
const save = () => localStorage.setItem(LSKEY, JSON.stringify(S));
let tab = "hoje", viewSession = null, progEx = null;

// ---------- Utilidades ----------
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n)?n:null; };
const fmtKg = v => v==null? "–" : (Math.round(v*10)/10).toString().replace(".", ",");
const fmtDate = d => new Date(d).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit"});
const mmss = s => { s=Math.max(0,Math.round(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
const e1rm = (kg,reps,rir=0) => (kg>0 && reps>0) ? kg*(1+(reps+(rir||0))/30) : 0;
const isLower = ex => /Quadr|Posterior|Glúteo|Adutor|Panturr/i.test(ex.muscle);
const roundStep = (v, step) => Math.round(v/step)*step;
const vidsOf = ex => VIDS[ex.id] || [];
const gifOf = ex => GIFS[ex.id] ? `gifs/${GIFS[ex.id]}.gif` : "";
const coverOf = vid => `https://i.ytimg.com/vi/${vid}/hqdefault.jpg`;
const thumbOf = ex => gifOf(ex);
const METHOD = {C:"cluster", B:"backoff", K:"kelso", RP:"restpause"};
// Bloco de mídia: GIF do boneco (offline) + capa do Short (toca no lugar ao tocar)
function mediaStrip(ex){
  const v = vidsOf(ex)[0];
  return `<div class="mgrid">
    <figure class="mbox gif" data-act="media" data-ex="${ex.id}"><img src="${gifOf(ex)}" alt="Animação: ${esc(ex.name)}"><figcaption>🧍 Movimento (offline)</figcaption></figure>
    ${v?`<figure class="mbox yt" id="yt-${ex.id}" data-act="inlinevid" data-ex="${ex.id}"><img src="${coverOf(v.id)}" alt="Short: ${esc(v.title)}" loading="lazy">
      <div class="play"><span>▶</span></div><figcaption>▶ Short no YouTube<br><small>${esc(v.ch)}</small></figcaption></figure>`:""}
  </div>`;
}
function howHtml(ex, open){
  const h = HOW[ex.id]; if(!h) return "";
  return `<details class="how" ${open?"open":""}><summary>📋 Como executar</summary>
    <span class="sinta">🎯 Onde sentir: ${esc(h.sinta)}</span>
    <h4>Ajuste</h4><ul>${h.ajuste.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    <h4>Execução</h4><ol>${h.passos.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
    <h4>Erros comuns</h4><ul class="bad">${h.erros.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    ${h.extra?`<h4>Técnica</h4><p style="font-size:13.5px;margin:0">${esc(h.extra)}</p>`:""}</details>`;
}
function iframeHtml(vid){ return `<iframe src="https://www.youtube-nocookie.com/embed/${vid}?autoplay=1&mute=1&loop=1&playlist=${vid}&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="Vídeo do exercício"></iframe>`; }
function videoBox(vid, wide){
  if(!navigator.onLine) return `<div class="vframe ${wide?"wide":""}"><div class="off">📴 Sem internet. O vídeo precisa de conexão.<br>A animação e o passo a passo funcionam offline.</div></div>`;
  return `<div class="vframe ${wide?"wide":""}">${iframeHtml(vid)}</div>`;
}
const ytSearch = q => "https://www.youtube.com/results?search_query="+encodeURIComponent(q+" como fazer shorts");
const setsFor = ex => {
  let list = ex.sets.slice();
  if (S.settings.phase==="base") list = list.map(t=> t==="N"?"N":(t==="C"||t==="B"?"N":null)).filter(Boolean).slice(0, Math.max(2, ex.sets.filter(t=>t==="N").length));
  if (S.settings.showWarm && ex.warm) list = ["W","W", ...list];
  return list;
};

// ---------- Histórico / progressão ----------
function exHistory(exId){
  return S.logs.filter(l=>l.sets && l.sets[exId] && l.sets[exId].some(s=>s.done && s.kg!=null))
    .map(l=>({date:l.date, sets:l.sets[exId], logId:l.id}))
    .sort((a,b)=>a.date-b.date);
}
function bestOf(sets){
  let b={e1:0,kg:null,reps:null,vol:0};
  sets.forEach(s=>{ if(!s.done||s.type==="W") return; const kg=num(s.kg)||0, r=num(s.reps)||0;
    b.vol+=kg*r; const v=e1rm(kg,r,num(s.rir)); if(s.type==="N"&&v>b.e1){b.e1=v;b.kg=kg;b.reps=r;} });
  return b;
}
function suggestion(ex){
  const h = exHistory(ex.id); if(!h.length) return {text:"Primeira vez: escolha uma carga em que você chegue entre 5 e 9 reps a 0–1 rep da falha.", kg:{}};
  const last = h[h.length-1], N = last.sets.filter(s=>s.type==="N"&&s.done&&num(s.reps)!=null);
  if(!N.length) return {text:"Sem séries normais registradas da última vez.",kg:{}};
  const step = isLower(ex)? S.settings.stepLower : S.settings.stepUpper;
  const topKg = Math.max(...N.map(s=>num(s.kg)||0));
  const reps = N.map(s=>num(s.reps));
  const minR = Math.min(...reps), allTop = reps.every(r=>r>=9);
  let next = topKg, msg;
  if (allTop){ next = Math.max(topKg+step, roundStep(topKg*(isLower(ex)?1.05:1.025), step)); msg = `✅ Bateu 9 reps em todas as séries → suba para <b>${fmtKg(next)} kg</b>.`; }
  else if (minR<5){ next = roundStep(topKg*0.92, step); msg = `⚠️ Caiu abaixo de 5 reps → reduza para <b>${fmtKg(next)} kg</b>.`; }
  else { msg = `➡️ Mantenha <b>${fmtKg(topKg)} kg</b> e tente +1 rep (último: ${reps.join(" / ")}).`; }
  const kg = { N: next, W: roundStep(next*0.5, step), C: roundStep(next*1.12, step), B: roundStep(next*0.75, step), K: roundStep(next*0.6,step), RP: next };
  const lastC = last.sets.find(s=>s.type==="C"&&s.done);
  if (lastC && num(lastC.kg)){ const cr = num(lastC.reps)||0; kg.C = cr>=9 ? Math.max(num(lastC.kg)+step, roundStep(num(lastC.kg)*1.025,step)) : num(lastC.kg); }
  return {text: msg + ` <span class="mut">Último treino: ${fmtDate(last.date)}.</span>`, kg, last};
}

// ---------- Rotação ----------
const rotSeq = () => ROTATIONS[S.rot.mode].seq;
const curRot = () => rotSeq()[S.rot.idx % rotSeq().length];
function advanceRot(){ S.rot.idx = (S.rot.idx+1) % rotSeq().length; save(); }

// ---------- Sessão em andamento ----------
function startSession(sid){
  if (S.draft && S.draft.sessionId!==sid && !confirm("Há um treino em andamento. Descartar e começar outro?")) return;
  if (!S.draft || S.draft.sessionId!==sid){
    const sess = SESS[sid], sets = {};
    sess.ex.forEach(ex=>{ const sg = suggestion(ex); sets[ex.id] = setsFor(ex).map(t=>({type:t, kg: sg.kg[t]!=null? String(sg.kg[t]) : "", reps:"", rir:"", done:false, suggested:true})); });
    S.draft = { id: "s"+Date.now(), sessionId:sid, date: Date.now(), start: Date.now(), sets, notes:"", sleep:"", energy:"", bw:"", sessRPE:"" };
    save();
  }
  viewSession = sid; tab = "treino"; render(); scrollTo(0,0);
}
function finishSession(){
  const d = S.draft; if(!d) return;
  const doneCount = Object.values(d.sets).flat().filter(s=>s.done).length;
  if (!doneCount && !confirm("Nenhuma série marcada como feita. Salvar mesmo assim?")) return;
  d.end = Date.now();
  Object.values(d.sets).forEach(arr=>arr.forEach(s=>delete s.suggested));
  S.logs.push(d);
  if (curRot()===d.sessionId) advanceRot();
  else { const i = rotSeq().indexOf(d.sessionId); if(i>=0){ S.rot.idx = (i+1)%rotSeq().length; } }
  if (num(d.bw)) S.body.push({date:d.date, bw:num(d.bw)});
  S.draft = null; save(); stopTimer(); tab="historico"; render(); scrollTo(0,0);
}

// ---------- Timer ----------
let tEnd=0, tInt=null, tBeeped=false;
function startTimer(sec,label){ tEnd = Date.now()+sec*1000; tBeeped=false; $("#tLabel").textContent=label||"Descanso"; $("#timer").classList.add("show"); clearInterval(tInt); tInt=setInterval(tick,250); tick(); }
function stopTimer(){ clearInterval(tInt); $("#timer").classList.remove("show","over"); }
function tick(){ const left=(tEnd-Date.now())/1000; $("#tVal").textContent = left>=0? mmss(left) : "+"+mmss(-left);
  $("#timer").classList.toggle("over", left<0);
  if(left<=0 && !tBeeped){ tBeeped=true; beep(); if(navigator.vibrate) navigator.vibrate([300,150,300]); } }
function beep(){ if(!S.settings.sound) return; try{ const c=new (window.AudioContext||window.webkitAudioContext)(); [0,0.25,0.5].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.25,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+.2);o.start(c.currentTime+t);o.stop(c.currentTime+t+.22);}); }catch(e){} }
function restFor(ex,type){
  if(type==="W") return 60;
  if(type==="C") return 20;
  if(type==="N"){ return ex.comp? S.settings.restComp : S.settings.restIso; }
  return S.settings.restIso;
}

// ---------- Render ----------
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab || (tab==="treino"&&b.dataset.tab==="hoje")));
  $("#netBadge").textContent = navigator.onLine? "🟢 online" : "⚪ offline";
  $("#hdrSub").textContent = PROGRAMS[S.settings.program].name;
  const v = {hoje:vHoje, treinos:vTreinos, treino:vTreino, progresso:vProgresso, historico:vHistorico, guia:vGuia}[tab]();
  $("#app").innerHTML = v;
  if (tab==="progresso") drawCharts();
}

function vHoje(){
  const cur = curRot(), seq = rotSeq();
  let h = "";
  if (S.draft){ const s=SESS[S.draft.sessionId]; const tot=Object.values(S.draft.sets).flat(), dn=tot.filter(x=>x.done).length;
    h += `<div class="card" style="border-color:var(--acc)"><div class="row"><div class="sp"><h3>⏱️ ${esc(s.name)} em andamento</h3><span class="mut">${dn}/${tot.length} séries · começou ${new Date(S.draft.start).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</span></div><button class="btn pri" data-act="open" data-sid="${s.id}">Continuar</button></div></div>`; }

function bodyCard(){

function lineChart(el, data, key, color){
  if(!el) return; const W=el.clientWidth||320, H=150, p=26;
  const ys=data.map(d=>d[key]).filter(v=>v>0); if(!ys.length){el.innerHTML="";return;}
  let mn=Math.min(...ys), mx=Math.max(...ys); if(mn===mx){mn*=.95;mx*=1.05||1;} const rng=mx-mn||1;
  const x=i=> p+(data.length===1? (W-2*p)/2 : i*(W-2*p)/(data.length-1)), y=v=> H-p-(v-mn)/rng*(H-2*p);
  const path=data.map((d,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(d[key]).toFixed(1)).join(" ");
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="#2b303b"/><text x="2" y="${y(mx)+3}">${fmtKg(mx)}</text><text x="2" y="${y(mn)+3}">${fmtKg(mn)}</text>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5"/>
    ${data.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d[key])}" r="3.5" fill="${color}"/>`).join("")}
    <text x="${p}" y="${H-8}">${fmtDate(data[0].date)}</text><text x="${W-p-48}" y="${H-8}">${fmtDate(data[data.length-1].date)}</text></svg>`;
}

}

function vGuia(){

    : `<p><b>PPL + Upper/Lower:</b> Push, Pull, Lower 1, descanso, Upper, Lower 2, descanso (5 treinos por semana). Também dá para fazer de segunda a sexta seguidos, mas ele recomenda testar primeiro com descansos entre os treinos.</p><p>O Upper repete os grupos do Push e do Pull com <b>exercícios diferentes</b> (variação de estímulo). Os padrões mais alongados (francês, rosca 45°) ficam na 2ª metade da semana porque causam mais dano muscular.</p><p>Volume: <b>2 séries de 5–9 reps</b>, a 1ª com 1 rep na reserva e a 2ª com 0 na reserva.</p>`}</div>
  <div class="card"><h3>Técnicas</h3>
  <p><span class="tag tC">Cluster 3×3</span> Pegue uma carga que você faria só 4–5 reps. Faça 3 reps, descanse 15–20 s, mais 3, descanse, mais 3. Total de 9 reps com carga pesada. Registre a carga e o <b>total de reps</b> (ex.: 9).</p>
  <p><span class="tag tB">Backoff</span> Logo após a última série normal, tire ~25% da carga, descanse ~30 s e vá até a falha.</p>
  <p><span class="tag tK">Kelso shrug</span> Depois da última série de remada, descanse 20–25 s e faça só retração das escápulas (sem dobrar os cotovelos) até não sair mais.</p>

  <li>A cada sessão, tente adicionar repetições mantendo a carga.</li>

  <li>Se alguma série cair abaixo de 5 reps, reduza ~8%.</li>
  <li>Cluster: comece ~12% acima da carga das séries normais. Se fechar os 9 reps, suba no próximo treino.</li></ol>

  $("#modalBox").innerHTML = `<div class="row"><h3 class="sp exname">${esc(ex.name)}</h3><button class="btn sm" data-act="close">✕ Fechar</button></div>
   <span class="mchip">🎯 ${esc(ex.muscle)}</span>
   <div class="mgrid" style="margin-top:10px">
     <figure class="mbox gif big"><img src="${gifOf(ex)}" alt="Animação"><figcaption>🧍 Movimento (offline)</figcaption></figure>
     <div>${vs.length>1?`<div class="tabs2">${vs.map((x,i)=>`<button class="btn sm ${i===modalVi?"on":""}" data-act="mvid" data-i="${i}">${i===0?"Short 1":"Short 2"}</button>`).join("")}</div>`:""}
       ${v? videoBox(v.id) : ""}</div>
   </div>
   ${v?`<div class="vsrc">“${esc(v.title)}” · ${esc(v.ch)} · <a href="https://www.youtube.com/shorts/${v.id}" target="_blank" rel="noopener" style="color:var(--blue)">abrir no YouTube</a></div>`:""}
   ${howHtml(ex, true)}
   <p class="pill" style="margin-top:8px"><a href="${ytSearch(ex.yt)}" target="_blank" rel="noopener" style="color:var(--blue)">Buscar outros Shorts deste exercício</a></p>`;
  $("#modal").classList.add("show"); $("#modalBox").scrollTop=0;
}
function methodModal(m){
  const v = (VIDS["_"+m]||[])[0], name = {cluster:"Cluster set",backoff:"Back-off set",kelso:"Kelso shrug",restpause:"Rest-pause"}[m];
  const txt = {cluster:"Carga que você faria só 4–5 reps. Faça 3 reps, descanse 15–20 s, mais 3, descanse, mais 3.",
    backoff:"Após a última série normal, tire ~25% da carga, descanse ~30 s e vá até a falha.",
    kelso:"Depois da última série de remada, descanse 20–25 s e faça só a retração das escápulas (sem dobrar os cotovelos) até a falha.",
    restpause:"Vá até a falha, descanse ~15 s, faça mais reps até a falha, repita mais uma vez."}[m];
  $("#modalBox").innerHTML = `<div class="row"><h3 class="sp">${name}</h3><button class="btn sm" data-act="close">✕ Fechar</button></div>
    <p style="font-size:14px">${txt}</p>${v? videoBox(v.id, m==="cluster"||m==="backoff") + `<div class="vsrc">“${esc(v.title)}” · ${esc(v.ch)}</div>
    <div class="row" style="justify-content:center"><a class="btn sm pri" href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">Abrir no YouTube</a></div>`:""}`;
  $("#modal").classList.add("show");
}
function closeModal(){ $("#modal").classList.remove("show"); $("#modalBox").innerHTML=""; }

// ---------- Eventos ----------
document.addEventListener("click", e=>{
  const nb = e.target.closest("nav button"); if(nb){ tab = nb.dataset.tab; render(); scrollTo(0,0); return; }
  const t = e.target.closest("[data-act]"); if(!t) { if(e.target.id==="modal") closeModal(); return; }
  const a = t.dataset.act, d = S.draft;
  if (a==="start"||a==="open") startSession(t.dataset.sid);
  else if (a==="back"){ tab="hoje"; render(); }
  else if (a==="skip"){ advanceRot(); render(); }
  else if (a==="restdone"){ advanceRot(); render(); }
  else if (a==="setrot"){ S.rot.idx=+t.dataset.i; save(); render(); }
  else if (a==="media") mediaModal(t.dataset.ex);
  else if (a==="mvid") mediaModal(modalEx, +t.dataset.i);
  else if (a==="inlinevid"){ const v=vidsOf(EXBYID[t.dataset.ex])[0]; if(!v) return; if(!navigator.onLine){ mediaModal(t.dataset.ex); return; } t.classList.add("playing"); t.removeAttribute("data-act"); t.innerHTML = iframeHtml(v.id) + `<a class="ytopen" href="https://www.youtube.com/shorts/${v.id}" target="_blank" rel="noopener">abrir no YouTube ↗</a>`; }
  else if (a==="method") methodModal(t.dataset.m);
  else if (a==="close") closeModal();
  else if (a==="done" && d){ const st=d.sets[t.dataset.ex][+t.dataset.i]; st.done=!st.done; st.suggested=false;
    if(st.done){ const ex=EXBYID[t.dataset.ex]; const arr=d.sets[t.dataset.ex], next=arr[+t.dataset.i+1];
      if(next){ const sec = next.type==="C"&&st.type!=="C" ? restFor(ex,"N") : (next.type==="B"?30:next.type==="K"?25:next.type==="RP"?restFor(ex,"N"):restFor(ex,st.type==="W"?"W":"N"));
        startTimer(sec, `${ex.name} → ${TYPE[next.type].lbl}`); }
      else startTimer(restFor(ex,"N"), "Próximo exercício"); }
    save(); render(); }
  else if (a==="addset" && d){ const arr=d.sets[t.dataset.ex]; const last=arr.filter(s=>s.type==="N").pop(); arr.push({type:"N",kg:last?last.kg:"",reps:"",rir:"",done:false}); save(); render(); }
  else if (a==="delset" && d){ const arr=d.sets[t.dataset.ex]; if(arr.length>1){ arr.pop(); save(); render(); } }
  else if (a==="finish") finishSession();
  else if (a==="discard"){ if(confirm("Descartar o treino em andamento?")){ S.draft=null; save(); stopTimer(); tab="hoje"; render(); } }
  else if (a==="dellog"){ if(confirm("Apagar este treino do histórico?")){ S.logs=S.logs.filter(l=>l.id!==t.dataset.id); save(); render(); } }
  else if (a==="export") download("treino-tryhard-backup-"+new Date().toISOString().slice(0,10)+".json", JSON.stringify(S,null,1), "application/json");
  else if (a==="csv"){ const rows=[["data","treino","exercicio","tipo","kg","reps","rir"]]; S.logs.forEach(l=>Object.entries(l.sets).forEach(([id,arr])=>arr.filter(s=>s.done).forEach(s=>rows.push([new Date(l.date).toISOString().slice(0,10),(SESS[l.sessionId]||{}).name,(EXBYID[id]||{}).name||id,TYPE[s.type].lbl,s.kg,s.reps,s.rir]))));
    download("treino-tryhard.csv", rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(";")).join("\n"), "text/csv"); }
});
document.addEventListener("input", e=>{
  const el=e.target, d=S.draft;
  if (el.dataset.f && d){ const st=d.sets[el.dataset.ex][+el.dataset.i]; st[el.dataset.f]=el.value; if(el.dataset.f==="kg"){st.suggested=false; el.style.color="";} save(); }
  else if (el.dataset.d && d){ d[el.dataset.d]=el.value; save(); }
  else if (el.dataset.s){ S.settings[el.dataset.s] = el.type==="checkbox"? el.checked : (num(el.value)??S.settings[el.dataset.s]); save(); }
});
document.addEventListener("change", e=>{
  const el=e.target;
  if (el.id==="rotMode"){ const cur=curRot(); S.rot.mode=el.value; const i=rotSeq().indexOf(cur); S.rot.idx=i>=0?i:0; save(); render(); }
  else if (el.id==="progPick"){ if(S.draft && !confirm("Há um treino em andamento. Trocar de programa mesmo assim?")){ render(); return; } S.settings.program=el.value; loadProgram(); progEx=null; save(); render(); }
  else if (el.id==="phase"){ S.settings.phase=el.value; save(); render(); }
  else if (el.id==="progSel"){ progEx=el.value; render(); }
  else if (el.id==="importFile" && el.files[0]){ const r=new FileReader(); r.onload=()=>{ try{ const j=JSON.parse(r.result); if(!Array.isArray(j.logs)) throw 0; if(confirm(`Importar ${j.logs.length} treinos? Isso substitui os dados atuais.`)){ S=Object.assign(defaultState(),j); save(); render(); } }catch(err){ alert("Arquivo inválido."); } }; r.readAsText(el.files[0]); }
});
document.querySelectorAll("[data-tadd]").forEach(b=>b.onclick=()=>{ tEnd+= +b.dataset.tadd*1000; tBeeped=false; tick(); });
$("#tStop").onclick=stopTimer;
function download(name, text, type){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }
addEventListener("online", render); addEventListener("offline", render);
if (S.draft) { tab="treino"; viewSession=S.draft.sessionId; }
render();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
